# Bonsai Configuration File

# Values will change here if changed in app

# -----------------------
# App Settings
# -----------------------
ENABLE_FOLDER_SIZE_PERCENTAGES = true
SCANNER_THREADS = 0                         # Threads used to scan the disk (0 = automatic)

# Colors: "auto", "truecolor", "256" or "16"
# - auto picks truecolor over SSH too: ROMEO doesn't receive COLORTERM, so it can't ask your terminal.
#   Set 256 if the colors look wrong (old macOS Terminal.app, screen).
COLOR_MODE = "auto"

# -----------------------
# Sidebar Settings
# -----------------------
SIDEBAR_GROWTH_THRESHOLD_PERCENTAGE = 0.2   # Show size changes above this percentage
SIDEBAR_WIDTH = 40

# Plain ASCII icons: they take one column in every terminal, so the columns stay aligned.
# With a Nerd Font, and a terminal that draws its icons one column wide, Nerd Font icons work too.
SIDEBAR_SELECTED_FOLDER_ICON = ">"
SIDEBAR_SELECTED_FILE_ICON = ">"
SIDEBAR_FOLDER_ICON = "+"
SIDEBAR_FILE_ICON = " "
SIDEBAR_BACK_ICON = "<"

SIDEBAR_GROWTH_COLOR = {255, 175, 95}
SIDEBAR_SHRINK_COLOR = {95, 125, 255}

# -----------------------
# Chart Settings
# -----------------------
CHART_MAX_SIZE_THRESHOLD_PERCENTAGE = 2     # Minimum % usage shown in pie chart
CHART_MAX_GENERATIONS = 4                   # Max rings in pie chart
CHART_MIN_SLICES = 10                       # Slices still drawn when nothing reaches the threshold (0 = none)
CHART_DIM_FACTOR = 0.15                     # Dimming factor for child slices
CHART_CELL_RATIO = 0                        # Height / width of a character cell, keeps the pie round (0 = ask the terminal)
CHART_HIGHLIGHT_SUBTREE = false             # true: the whole selected folder turns gray (upstream), false: only its slice turns white

# One color per line: {R, G, B}
CHART_COLORS = [
    {255, 99, 71},                          # Tomato Red
    {30, 144, 255},                         # Dodger Blue
    {60, 179, 113},                         # Medium Sea Green
    {255, 165, 0},                          # Orange
    {186, 85, 211},                         # Medium Orchid
    {255, 215, 0},                          # Gold
    {70, 130, 180},                         # Steel Blue
    {255, 105, 180},                        # Hot Pink
    {154, 205, 50},                         # Yellow Green
    {255, 140, 0}                           # Dark Orange
]
